name: Daily NETEM Vocabulary

on:
  schedule:
    - cron: '0 0 * * *'   # 每日 08:00 北京时间（UTC+8）自动运行
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 YYYY-MM-DD（留空 = 运行器当天日期）'
        required: false
        type: string
      force:
        description: '忽略"今日已生成"记录，强制重新生成'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-vocab
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  vocab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run unit tests
        run: |
          python -m tests.vocab_test
          python -m tests.test_vocab_web
          python -m tests.test_vocab_cleanup
          python -m tests.test_vocab_skip

      - name: Validate secrets and dry-run
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$DEEPSEEK_API_KEY" ] || { echo "::error::缺少 DEEPSEEK_API_KEY secret"; exit 1; }
          python -m src.vocab_main --dry-run

      - name: Run daily vocabulary
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          VOCAB_PER_DAY: ${{ vars.VOCAB_PER_DAY }}
          VOCAB_SKIP_WORDS: ${{ vars.VOCAB_SKIP_WORDS }}
          VOCAB_START: ${{ vars.VOCAB_START }}
          GIT_COMMIT: "true"
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m src.vocab_main $ARGS --commit

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="每日考研词汇自动运行失败 $(date -u +%F)"
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="每日考研词汇工作流运行失败。详见 $run_url"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi
