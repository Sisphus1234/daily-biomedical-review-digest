name: Daily Biomedical Review Digestion

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run daily digestion
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          PUBMED_EMAIL: ${{ secrets.PUBMED_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS }}
          RETMAX: ${{ vars.RETMAX }}
          GIT_COMMIT: "true"
        run: python -m src.main --commit

      - name: Debug on failure
        if: failure()
        run: echo "::error::Daily digestion failed. Check DEEPSEEK_API_KEY and PUBMED_EMAIL secrets."